<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人簡介首頁 - Niii510</title>
  <!-- 引入 jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 36px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #111;
    }
    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }
    .bio {
      text-align: left;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
      background: #f8f9fa;
      padding: 16px;
      border-left: 4px solid #007bff;
      border-radius: 4px;
    }
    .btn {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #0056b3;
    }
    #ajax-box {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      background: #eef4ff;
      color: #0056b3;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>歡迎來到我的個人首頁</h1>
    <p class="subtitle">Web Fundamental - Assignment Showcase</p>
    
    <div class="bio">
      <p>👋 哈囉！這是我透過 GitHub Pages 部署的個人展示頁面。</p>
      <p style="margin-top: 8px;">本頁面使用 HTML5 與 CSS 進行切版，並透過 jQuery 實作事件監聽與 Ajax 非同步資料載入功能。</p>
    </div>

    <!-- 作業要求的 jQuery 互動與 Ajax 功能 -->
    <button id="quote-btn" class="btn">點擊載入即時名言 (jQuery Ajax)</button>
    <div id="ajax-box"></div>
  </div>

  <script>
    $(document).ready(function() {
      $('#quote-btn').on('click', function() {
        const $box = $('#ajax-box');
        $box.hide().text('資料讀取中...').fadeIn(200);

        // 使用 jQuery $.ajax 非同步取得隨機名言（展示 Ajax 功能）
        $.ajax({
          url: 'https://dummyjson.com/quotes/random',
          method: 'GET',
          dataType: 'json',
          success: function(data) {
            $box.html(`"${data.quote}"<br><strong style="font-size:12px; margin-top:4px; display:inline-block;">— ${data.author}</strong>`);
          },
          error: function() {
            // 備用展示，確保在任何網路限制下按鈕點擊皆有反應
            $box.html('"Stay hungry, stay foolish."<br><strong style="font-size:12px; margin-top:4px; display:inline-block;">— Steve Jobs</strong>');
          }
        });
      });
    });
  </script>

</body>
</html>
